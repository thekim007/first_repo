<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello, World!</title>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --accent: #c8f564;
      --accent2: #6464f5;
      --text: #e8e8f0;
      --muted: #5a5a7a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* 배경 격자 무늬 */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(100,100,245,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(100,100,245,0.06) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }

    .container {
      position: relative;
      text-align: center;
      padding: 3rem 2rem;
      animation: fadeUp 0.9s cubic-bezier(0.16,1,0.3,1) both;
    }

    /* 빛나는 원형 배경 효과 */
    .glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 360px;
      height: 360px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,245,100,0.12) 0%, transparent 70%);
      pointer-events: none;
      animation: pulse 4s ease-in-out infinite;
    }

    .tag {
      font-size: 0.72rem;
      letter-spacing: 0.25em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.9s 0.1s cubic-bezier(0.16,1,0.3,1) both;
    }

    h1 {
      font-family: 'Gowun Batang', serif;
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.9s 0.2s cubic-bezier(0.16,1,0.3,1) both;
    }

    h1 span {
      color: var(--accent);
      position: relative;
    }

    h1 span::after {
      content: '';
      position: absolute;
      bottom: 4px;
      left: 0; right: 0;
      height: 3px;
      background: var(--accent);
      border-radius: 2px;
    }

    .desc {
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.8;
      max-width: 420px;
      margin: 0 auto 2.5rem;
      animation: fadeUp 0.9s 0.3s cubic-bezier(0.16,1,0.3,1) both;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeUp 0.9s 0.4s cubic-bezier(0.16,1,0.3,1) both;
    }

    .btn {
      display: inline-block;
      padding: 0.75rem 1.8rem;
      font-family: 'Space Mono', monospace;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #0a0a0f;
      border: none;
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(200,245,100,0.35);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text);
      border: 1.5px solid var(--muted);
    }

    .btn-secondary:hover {
      border-color: var(--accent2);
      color: var(--accent2);
      transform: translateY(-3px);
    }

    /* 하단 상태 표시줄 */
    .status-bar {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.72rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      animation: fadeUp 0.9s 0.6s cubic-bezier(0.16,1,0.3,1) both;
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: blink 2s ease-in-out infinite;
    }

    /* 카운터 */
    .counter-wrap {
      margin: 2rem 0 0;
      animation: fadeUp 0.9s 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }

    .counter {
      font-size: 3rem;
      font-weight: 700;
      color: var(--accent2);
      line-height: 1;
    }

    .counter-label {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-top: 0.4rem;
    }

    /* 키프레임 (애니메이션 정의) */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      50%       { transform: translate(-50%, -50%) scale(1.12); opacity: 0.7; }
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="glow"></div>

    <p class="tag">— 첫 번째 저장소 —</p>

    <h1>Hello,<br /><span>World!</span></h1>

    <p class="desc">
      나의 첫 GitHub 레포지토리에 오신 것을 환영합니다.<br />
      작은 시작이 큰 여정의 출발점이 됩니다.
    </p>

    <div class="btn-group">
      <a class="btn btn-primary" href="https://github.com/thekim007/first_repo" target="_blank">GitHub 보기</a>
      <button class="btn btn-secondary" onclick="count()">클릭해보세요 👾</button>
    </div>

    <div class="counter-wrap">
      <div class="counter" id="cnt">0</div>
      <div class="counter-label">CLICKS</div>
    </div>
  </div>

  <div class="status-bar">
    <span class="dot"></span>
    <span>first_repo · thekim007 · LIVE</span>
  </div>

  <script>
    let n = 0;
    const el = document.getElementById('cnt');
    function count() {
      n++;
      el.textContent = n;
      el.style.transform = 'scale(1.3)';
      setTimeout(() => el.style.transform = 'scale(1)', 150);
      el.style.transition = 'transform 0.15s';
    }
  </script>

</body>
</html>
